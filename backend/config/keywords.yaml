# config/keywords.yaml — 키워드 시드 (DB 가 비어 있을 때 한 번만 들어가고, 이후엔 관리 > 수집 설정 > 키워드에서 편집한다).
# include 키워드 중 하나라도 걸려야 후보가 되고, exclude 키워드가 걸리면 버린다. category 는 AX Review 의 3개 분류.
# needs_ai: true — 업종·직무처럼 넓은 단어. 같은 글에 AI 관련 단어(filters.AI_ANCHORS 또는 다른 포함 규칙)가 함께 있을 때만 통과.
# 매칭: 영어는 단어 경계(짧은 약어는 앞뒤, 긴 단어는 앞), 한글은 포함 검사 (pipeline/filters.py).
# 2026-10-30 보강: 20개 → 36개 규칙. 업종·직무·플랫폼·인프라·거버넌스·피지컬 AI 사례까지 넓히고, 넓은 단어는 needs_ai 로 묶었다.

