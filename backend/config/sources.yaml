# config/sources.yaml — AX Review 수집 소스.
# 각 소스의 group/site는 홈 화면 "어디서 찾아 읽나" 목록에 쓰인다. 수집 on/off는
# 관리 > 수집 설정에서 바꾸며 data/settings.json에 저장된다.
# (2026-10-27 실측: HBR·Microsoft AI·BCG·Deloitte·HBS WK·The Batch 피드는 응답 없음/404라 제외)
# type: html — RSS가 없는 사이트를 목록 페이지 HTML로 읽는다(parser: hbr/bcg, pipeline/collectors/html_pages.py).

pipeline:
  dedup:
    title_similarity_threshold: 88
    title_recent_days: 7
  gemini:
    # 무료 등급 키는 모델별·프로젝트별 하루 요청 수가 매우 적다(2026-10-27 실측: gemini-2.5-flash 20회/일).
    # 호출이 많은 채점·질문하기를 가벼운 모델로 돌리고 싶으면 아래 *_model 값을 바꾼다.
    model: gemini-2.5-flash          # 기본값 (아래 항목이 비어 있으면 사용)
    score_model: gemini-2.5-flash    # 수집 기사 AX 관련도 채점 (배치당 1회)
    note_model: gemini-2.5-flash     # 노트 초안 (기사당 1회)
    weekly_model: gemini-2.5-flash   # 주간 흐름 (주 1회)
    chat_model: gemini-2.5-flash     # AX 질문하기·데일리 AI 종합 (질문당 1~3회)
    score_batch_size: 150          # 수집 한 번의 기사를 요청 한 번에 (이보다 많을 때만 나눔)
  # 기사 본문을 가져와 노트 초안에 넣을 최대 글자 수
  article_max_chars: 15000

